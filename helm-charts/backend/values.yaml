# ─── Replica Count ────────────────────────────────────────────
replicaCount: 3

# ─── Image ────────────────────────────────────────────────────
image:
  repository: abdelrhmanmohamed1102002/mern-backend
  tag: "latest"
  pullPolicy: Always

# ─── Service ──────────────────────────────────────────────────
service:
  type: NodePort
  port: 5000
  nodePort: 30500

# ─── Environment Variables ────────────────────────────────────
env:
  DB_HOST: "10.109.18.212"
  DB_PORT: "27017"
  DB_NAME: "merndb"
  DB_USER: "abdelrhman"
  DB_PASSWORD: "123456"
  CLOUDINARY_CLOUD_NAME: "duvef6kqj"
  CLOUDINARY_API_KEY: "571962183474343"
  CLOUDINARY_API_SECRET: "ormGE32ue1n3gKGulCNwPyVuDas"

# ─── Secrets (recommended for production) ─────────────────────
useSecret: false

# ─── Resources ────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ─── Persistent Volume for uploads ────────────────────────────
persistence:
  enabled: true
  storageClass: ""
  size: 1Gi
  mountPath: /app/uploads

# ─── Liveness & Readiness (disabled temporarily) ──────────────
livenessProbe:
  enabled: false

readinessProbe:
  enabled: false

# ─── MongoDB ──────────────────────────────────────────────────
mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "4.4"
  auth:
    rootUsername: abdelrhman
    rootPassword: "123456"
  service:
    port: 27017
  persistence:
    enabled: true
    size: 5Gi

# ─── Autoscaling ──────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
