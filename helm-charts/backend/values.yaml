replicaCount: 3

image:
  repository: abdelrhmanmohamed1102002/mern-backend
  tag: "6a06b592d29ca9e9cee1db67803ab01495045466"
  pullPolicy: Always

service:
  type: NodePort
  port: 5000
  nodePort: 30500

env:
  DB_HOST: "mongodb-service"
  DB_PORT: "27017"
  DB_NAME: "${{ secrets.DB_NAME }}"
  DB_USER: "${{ secrets.DB_USER }}"
  DB_PASSWORD: "${{ secrets.DB_PASSWORD }}"
  CLOUDINARY_CLOUD_NAME: "${{ secrets.CLOUDINARY_CLOUD_NAME }}"
  CLOUDINARY_API_KEY: "${{ secrets.CLOUDINARY_API_KEY }}"
  CLOUDINARY_API_SECRET: "${{ secrets.CLOUDINARY_API_SECRET }}"

useSecret: false
persistence:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "4.4"
  auth:
    rootUsername: abdelrhman
    rootPassword: "123456"
  service:
    port: 27017
  persistence:
    enabled: true
    size: 5Gi
    storgeClass: local-storge

# ─── Autoscaling ──────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
