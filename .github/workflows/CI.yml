name: CI Pipeline - Build, Scan, Test, and Push

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'k8s-ansible/**'
      - 'project screenshots/**'
      - 'docker-compose.yml'
      - '.env.example'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════
  # Job 1: Backend Tests + SonarCloud
  # ═══════════════════════════════════════════════════════════
  backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: MERN_PROJECT_BACKEND/package-lock.json

      - name: Install Backend Dependencies
        working-directory: MERN_PROJECT_BACKEND
        run: npm ci

      - name: Run Jest Tests with Coverage
        working-directory: MERN_PROJECT_BACKEND
        run: npm run test:ci

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: MERN_PROJECT_BACKEND
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ═══════════════════════════════════════════════════════════
  # Job 2: Frontend Tests + SonarCloud
  # ═══════════════════════════════════════════════════════════
  frontend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: MERN_PROJECT_FRONTEND/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: MERN_PROJECT_FRONTEND
        run: npm ci

      - name: Run Jest Tests with Coverage
        working-directory: MERN_PROJECT_FRONTEND
        run: npm run test:ci

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: MERN_PROJECT_FRONTEND
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ═══════════════════════════════════════════════════════════
  # Job 3: Build, Scan, and Push
  # ═══════════════════════════════════════════════════════════
  build-and-push:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Backend ──────────────────────────────────────────
      - name: Build Backend Image
        run: |
          docker build --no-cache \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:${{ github.sha }} \
            ./MERN_PROJECT_BACKEND

      - name: Scan Backend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:${{ github.sha }}

      # ── Frontend ─────────────────────────────────────────
      # FIX: No hardcoded URL — injected at runtime by nginx
      - name: Build Frontend Image
        run: |
          docker build --no-cache \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:${{ github.sha }} \
            ./MERN_PROJECT_FRONTEND

      - name: Scan Frontend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:${{ github.sha }}

      # ── Update Helm Tags ──────────────────────────────────
      - name: Update Helm image tags with git SHA
        run: |
          sed -i "s|tag: \"latest\"|tag: \"${{ github.sha }}\"|g" \
            helm-charts/backend/values.yaml \
            helm-charts/frontend/values.yaml

      - name: Commit updated Helm values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm-charts/backend/values.yaml helm-charts/frontend/values.yaml
          git diff --staged --quiet || \
            git commit -m "ci: update image tags to ${{ github.sha }} [skip ci]"
          git push

      - name: Build Complete
        run: echo "All images built, scanned, and pushed successfully!"
