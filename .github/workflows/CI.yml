name: CI Pipeline - Build, Scan, Test, and Push

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'k8s-ansible/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Backend Testing with Jest & SonarCloud
  # ═══════════════════════════════════════════════════════════════
  backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # Needed to checkout code
      pull-requests: write    # Needed for SonarCloud to add PR comments
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: MERN_PROJECT_BACKEND/package-lock.json

      - name: Install Backend Dependencies
        working-directory: MERN_PROJECT_BACKEND
        run: npm ci

      - name: Create tests directory
        working-directory: MERN_PROJECT_BACKEND
        run: mkdir -p tests

      - name: Run Jest Tests
        working-directory: MERN_PROJECT_BACKEND
        run: |
          if npm run | grep -q "test"; then
            npm run test:ci || echo "Tests completed with warnings"
          else
            echo "No tests configured yet"
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: MERN_PROJECT_BACKEND
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # Job 2: Frontend Testing with Jest & SonarCloud
  # ═══════════════════════════════════════════════════════════════
  frontend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # Needed to checkout code
      pull-requests: write    # Needed for SonarCloud to add PR comments
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: MERN_PROJECT_FRONTEND/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: MERN_PROJECT_FRONTEND
        run: npm ci

      - name: Run Jest Tests with Coverage
        working-directory: MERN_PROJECT_FRONTEND
        run: |
          if npm run | grep -q "test"; then
            npm test -- --coverage --watchAll=false --ci --passWithNoTests
          else
            echo "No tests configured yet"
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: MERN_PROJECT_FRONTEND
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Build, Scan, and Push to Docker Hub
  # ═══════════════════════════════════════════════════════════════
  build-and-push:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: success()
    permissions:
      contents: read          # Needed to checkout code

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Backend Build, Scan & Push ---
      - name: Build Backend Image
        run: docker build --no-cache -t ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:latest ./MERN_PROJECT_BACKEND

      - name: Scan Backend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:latest

      # --- Frontend Build, Scan & Push ---
      - name: Build Frontend Image
        run: |
          docker build \
            --no-cache \
            --build-arg REACT_APP_SERVER_URL=http://172.20.10.6:30500 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:latest \
            ./MERN_PROJECT_FRONTEND

      - name: Scan Frontend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:latest

      - name: Build Complete
        run: echo "✅ All images built, scanned, and pushed successfully!"
