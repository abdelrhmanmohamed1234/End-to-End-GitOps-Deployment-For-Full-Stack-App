apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mern-stack-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/abdelrhmanmohamed1234/End-to-End-GitOps-Deployment-For-Full-Stack-App.git'
    targetRevision: HEAD
    path: helm-charts/
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mern-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
